name: Synthetic workflow checks
on:
  push:
    paths: ['R/**', 'workflows/**', 'config/**', 'scripts/**', 'tests/**', '.github/workflows/checks.yml']
  pull_request:
    paths: ['R/**', 'workflows/**', 'config/**', 'scripts/**', 'tests/**', '.github/workflows/checks.yml']
permissions:
  contents: read
jobs:
  synthetic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - name: System libraries
        run: sudo apt-get update -qq && sudo apt-get install -y libgdal-dev libgeos-dev libproj-dev libudunits2-dev libglpk-dev
      - name: R dependencies
        run: Rscript scripts/install_dependencies.R tests
      - name: Parse and run synthetic regression checks
        run: Rscript scripts/check_workflows.R
